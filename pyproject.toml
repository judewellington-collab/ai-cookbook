[project]
name = "ai-cookbook"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "judewellington-collab", email = "jude.wellington@vmdataconsulting.com" }
]
requires-python = ">=3.15"
dependencies = [
    "google-genai>=3.6.1",
    "ipykernel>=7.4.0",
    "openai>=3.55.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
ai-cookbook = "ai_cookbook:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
